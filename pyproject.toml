[project]
name = "mems-mcp"
version = "0.1.0"
description = "MCP server exposing the Soprano Design Connect API (SMS, WhatsApp, RCS, Email, Voice, Viber, Push) as tools for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13",
    "boto3>=1.40",
    "truststore>=0.10.4",
    "uvicorn>=0.51.0",
]

[project.urls]
Repository = "https://github.com/soprano-mcp/mcp"
Issues = "https://github.com/soprano-mcp/mcp/issues"

[project.scripts]
mems-mcp = "mems_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "moto[dynamodb]>=5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
