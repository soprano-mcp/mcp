<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorize $client_name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --brand: #F71A68;
    --brand-dark: #D52060;
    --brand-purple: #9747FF;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --border: #d9d9de;
    --danger-bg: #fdecea;
    --danger-text: #b00020;
    --bg: #191A15;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    padding: 32px 28px;
  }
  .brand {
    margin-bottom: 24px;
  }
  .brand-mark {
    height: 26px;
    width: auto;
    display: block;
  }
  h1 {
    font-family: 'Urbanist', sans-serif;
    font-weight: 800;
    font-size: 20px;
    line-height: 1.4;
    margin: 0 0 4px;
  }
  h1 strong {
    background: linear-gradient(90deg, var(--brand-purple), var(--brand));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 18px;
  }
  .scopes {
    list-style: none;
    padding: 0;
    margin: 0 0 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .scopes li {
    font-size: 14px;
    padding-left: 22px;
    position: relative;
  }
  .scopes li::before {
    content: "\2713";
    position: absolute;
    left: 0;
    color: var(--brand);
    font-weight: 700;
  }
  .alert {
    background: var(--danger-bg);
    color: var(--danger-text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(247, 26, 104, 0.15);
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  button {
    flex: 1;
    padding: 11px 16px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.05s ease;
  }
  button:active { transform: scale(0.98); }
  button[value="approve"] {
    background: linear-gradient(90deg, var(--brand-purple), var(--brand));
    color: #fff;
  }
  button[value="approve"]:hover { background: linear-gradient(90deg, var(--brand-purple), var(--brand-dark)); }
  button[value="deny"] {
    background: #fff;
    color: var(--muted);
    border-color: var(--border);
  }
  button[value="deny"]:hover { background: #f5f5f7; }
  .footnote {
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img class="brand-mark" src="$logo_data_uri" alt="Soprano">
  </div>
  <h1><strong>$client_name</strong> wants to access your account</h1>
  <p class="subtitle">This app is requesting permission to:</p>
  <ul class="scopes">$scope_html</ul>
  $error_html
  <form method="post">
    $hidden_html
    <div class="field">
      <label for="api_id">Connect API ID</label>
      <input type="text" id="api_id" name="api_id" required autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="api_key">Connect API Key</label>
      <input type="password" id="api_key" name="api_key" required autocomplete="current-password">
    </div>
    <div class="actions">
      <button type="submit" name="action" value="deny">Deny</button>
      <button type="submit" name="action" value="approve">Approve</button>
    </div>
  </form>
  <p class="footnote">Credentials are sent directly to Soprano Connect and are never stored by this app.</p>
</div>
</body>
</html>
